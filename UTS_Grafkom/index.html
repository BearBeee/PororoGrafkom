<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eddy, Poby &amp; Loopy</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* ---------- bar kontrol (disembunyikan dengan tombol H saat merekam) ---------- */
    #bar {
      position: fixed; top: 12px; left: 0; right: 0; margin: 0 auto; width: fit-content;
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; border-radius: 14px;
      background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(8px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
      color: #23401c; font-size: 14px; user-select: none;
      transition: opacity 0.2s;
      max-width: calc(100vw - 32px); box-sizing: border-box; flex-wrap: wrap; justify-content: center;
    }
    #bar.hidden { opacity: 0; pointer-events: none; }
    #bar button {
      border: none; border-radius: 9px; padding: 6px 11px; cursor: pointer;
      background: #3f8f2a; color: white; font-size: 14px; font-weight: 600;
    }
    #bar button:hover { background: #33771f; }
    #bar button.light { background: #e3efd9; color: #23401c; }
    #bar button.light:hover { background: #d3e6c4; }
    #bar button.on { background: #6b4fbf; color: white; }          /* kamera ghost aktif */
    #bar button.on:hover { background: #5a40a8; }
    #time { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 92px; text-align: center; }
    #seek { width: 220px; accent-color: #3f8f2a; }
    #phase { min-width: 110px; font-weight: 600; color: #b23a3a; }
    #keys { flex-basis: 100%; text-align: center; font-size: 12px; opacity: 0.65; margin-top: -4px; }

    /* pesan kecil yang muncul sebentar saat bar disembunyikan */
    #toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      padding: 6px 12px; border-radius: 10px; background: rgba(0, 0, 0, 0.6); color: white;
      font-size: 13px; opacity: 0; transition: opacity 0.4s; pointer-events: none;
    }
    #toast.show { opacity: 1; }
  </style>
  <script type="module" src="main.js"></script>
</head>
<body>
  <canvas id="mycanvas"></canvas>

  <div id="bar">
    <button id="btnRestart" title="Ulang dari awal (0)">⏮ Replay</button>
    <button id="btnPlay" title="Jeda / lanjut (Spasi)">⏸ Pause</button>
    <span id="time">00.0 / 60 s</span>
    <input id="seek" type="range" min="0" max="60" step="0.1" value="0" title="Lompat ke detik tertentu">
    <span id="phase">Opening</span>
    <button id="btnGhost" class="light" title="Ganti kamera: orbit / ghost (G)">🎥 Orbit (G)</button>
    <button id="btnCam" class="light" title="Reset kamera (R)">⟲ Camera</button>
    <button id="btnHide" class="light" title="Sembunyikan bar (H)">Hide (H)</button>
    <span id="keys">Space pause · ←/→ 1 s · 0 replay · R camera · H hide</span>
  </div>
  <div id="toast">Press H to show the controls</div>
</body>
</html>
